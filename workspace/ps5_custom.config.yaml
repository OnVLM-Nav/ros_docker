teleop_twist_joy_node:
  ros__parameters:

    # ── 동작 모드 ─────────────────────────────────────────────────────────────
    # enable 버튼을 누르는 동안만 명령 전송 (false 시 항상 전송)
    require_enable_button: true
    # 역방향 주행 시 좌우 회전 반전 여부
    inverted_reverse: false
    # true: TwistStamped 퍼블리시 / false: Twist 퍼블리시
    publish_stamped_twist: false
    # publish_stamped_twist: true 일 때 헤더에 사용할 frame_id
    frame: "teleop_twist_joy"

    # ── 버튼 매핑 ─────────────────────────────────────────────────────────────
    # PS5 DualSense 버튼 인덱스:
    #   0:×  1:○  2:□  3:△  4:L1  5:R1  6:L2(디지털)  7:R2(디지털)
    #   8:Create  9:Options  10:PS  11:L3  12:R3
    enable_button: 4        # 일반 속도 enable (L1); 기본값 ps5=7(R2)
    enable_turbo_button: 5  # 터보 속도 enable (R1); -1 이면 비활성화

    # ── 선형 축 매핑 ─────────────────────────────────────────────────────────
    # PS5 DualSense 축 인덱스:
    #   0:왼쪽스틱 좌우  1:왼쪽스틱 상하  2:L2(아날로그)
    #   3:오른쪽스틱 좌우  4:오른쪽스틱 상하  5:R2(아날로그)
    # -1 이면 해당 축 비활성화
    axis_linear:
      x: 1    # 전후 (왼쪽스틱 상하)
      y: 0   # 좌우 (왼쪽스틱 좌우)
      z: -1   # 상하 (드론 등)

    # ── 선형 속도 스케일 (일반) ───────────────────────────────────────────────
    scale_linear:
      x: 0.7
      y: 0.7
      z: 0.0

    # ── 선형 속도 스케일 (터보) ───────────────────────────────────────────────
    scale_linear_turbo:
      x: 1.5
      y: 1.5
      z: 0.0

    # ── 각속도 축 매핑 ────────────────────────────────────────────────────────
    # -1 이면 해당 축 비활성화
    axis_angular:
      yaw: 3    # 좌우 회전 (오른쪽 스틱 좌우)
      pitch: -1
      roll: -1

    # ── 각속도 스케일 (일반) ──────────────────────────────────────────────────
    scale_angular:
      yaw: 0.5
      pitch: 0.0
      roll: 0.0

    # ── 각속도 스케일 (터보) ──────────────────────────────────────────────────
    scale_angular_turbo:
      yaw: 1.0
      pitch: 0.0
      roll: 0.0
